name: APK Android de test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-test.yml', 'child-audio.js', 'child-narrator.js', 'comfort.js', 'comfort.css', 'eclat_v73_deployable.html', 'data/reading-catalog.json', 'narration-credits.html']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Préparer et contrôler le client
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run prepare:android
      - name: Compiler le fichier installable
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Conserver l’APK et son empreinte
        run: |
          mkdir -p apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk apk/eclat-test.apk
          sha256sum apk/eclat-test.apk > apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eclat-android-test
          path: apk/
          retention-days: 30
