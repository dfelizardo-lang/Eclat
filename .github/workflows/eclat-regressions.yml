name: Éclat - régressions des corrections Squash
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier l'historique, l'export et l'audio
        run: node --test eclat-regressions.test.js child-audio.test.js automation/playwright/scripts/target.test.cjs automation/playwright/scripts/link-squash.test.cjs
