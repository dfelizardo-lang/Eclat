name: Validation finale des 2 échecs Squash
on:
  push:
    branches: [fix/squash-final-20261021]
  workflow_dispatch:

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ECLAT_BASE_URL: http://127.0.0.1:3000
      ECLAT_LOCAL_TEST: "1"
      ECLAT_USE_EXISTING_LOCAL_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Installer l'application
        run: npm ci
      - name: Démarrer la branche testée
        run: |
          node server.js > /tmp/eclat-server.log 2>&1 &
          echo $! > /tmp/eclat-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eclat-server.log
          exit 1
      - name: Installer Playwright
        working-directory: automation/playwright
        run: npm ci
      - name: Installer Chromium
        working-directory: automation/playwright
        run: npx playwright install --with-deps chromium
      - name: Vérifier la limite de 50 photos
        working-directory: automation/playwright
        run: >
          npx playwright test tests/eclat.spec.js
          --config=playwright.config.js
          --grep "ECL-TC-055"
      - name: Tests audio unitaires
        if: always()
        run: node --test child-audio.test.js
      - name: Journal serveur
        if: failure()
        run: cat /tmp/eclat-server.log || true

  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ECLAT_BASE_URL: http://127.0.0.1:3000
      ECLAT_LOCAL_TEST: "1"
      ECLAT_USE_EXISTING_LOCAL_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Démarrer la branche testée
        run: |
          node server.js > /tmp/eclat-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eclat-server.log
          exit 1
      - name: Installer Playwright
        working-directory: automation/playwright
        run: npm ci
      - name: Installer Chromium
        working-directory: automation/playwright
        run: npx playwright install --with-deps chromium
      - name: Vérifier le zoom à 200 pour cent
        working-directory: automation/playwright
        run: >
          npx playwright test tests/eclat.spec.js
          --config=playwright.config.js
          --grep "ECL-TC-035"
      - name: Journal serveur
        if: failure()
        run: cat /tmp/eclat-server.log || true
