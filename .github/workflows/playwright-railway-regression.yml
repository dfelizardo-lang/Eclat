name: Validation Railway des 15 échecs Squash
on:
  workflow_dispatch:
concurrency:
  group: squash-railway-final
  cancel-in-progress: true
jobs:
  regression-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: automation/playwright
    env:
      ECLAT_BASE_URL: https://eclat-production-cd17.up.railway.app
      ECLAT_LOCAL_TEST: "0"
      ECLAT_ALLOW_RAILWAY_ORIGIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: automation/playwright/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Relancer les 15 échecs sur Railway
        shell: bash
        run: |
          grep_expr="$(node scripts/final-regression-grep.cjs)"
          npx playwright test tests/eclat.spec.js             --config=playwright.config.js             --grep "$grep_expr"
