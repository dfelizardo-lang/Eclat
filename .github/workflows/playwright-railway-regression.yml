name: Validation branche des 14 échecs Squash
on:
  push:
    branches: [fix/squash-final-20261021]
  workflow_dispatch:
jobs:
  regression-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ECLAT_BASE_URL: http://127.0.0.1:3000
      ECLAT_LOCAL_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Installer l'application
        run: npm ci
      - name: Démarrer la branche testée
        run: |
          node server.js > /tmp/eclat-server.log 2>&1 &
          echo $! > /tmp/eclat-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eclat-server.log
          exit 1
      - name: Installer Playwright
        working-directory: automation/playwright
        run: npm ci
      - name: Installer les navigateurs
        working-directory: automation/playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Relancer les 14 échecs sur le code de la branche
        working-directory: automation/playwright
        run: >
          npx playwright test tests/eclat.spec.js
          --config=playwright.config.js
          --grep "ECL-TC-(026|031|035|050|055|058|067|068|077|085|088|090|092|093)"
      - name: Afficher le journal serveur en cas d'échec
        if: failure()
        run: cat /tmp/eclat-server.log || true
