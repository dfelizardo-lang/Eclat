<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Éclat — Bibliothèques</title><style>body{margin:0;background:#f6f0e7;color:#25221f;font-family:Georgia,serif}.wrap{max-width:760px;margin:8vh auto;padding:28px}.card{background:#fffdf8;border:1px solid #ded5c8;border-radius:24px;padding:28px;box-shadow:0 18px 60px #473e3320}h1{font-size:42px;margin:0 0 8px}p{line-height:1.6;color:#6f665b}.row{display:flex;gap:10px;margin:24px 0 12px}input{flex:1;padding:15px 16px;border:1px solid #b8aa98;border-radius:12px;font-size:18px;color:#1f2426;background:#fff}button{border:0;border-radius:12px;padding:0 20px;background:#173b48;color:white;font-weight:800;cursor:pointer}.status{min-height:22px;font:14px system-ui;color:#665d53}.results{display:grid;gap:10px;margin-top:14px}.item{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:15px;border:1px solid #e0d7ca;border-radius:14px;background:white}.rank{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#173b48;color:white;font:700 12px system-ui}.item strong{font-size:17px}.item p{font:13px/1.45 system-ui;margin:5px 0 0}.item a{font:12px system-ui;color:#2f6975}button:disabled{opacity:.6}</style></head><body><main class="wrap"><div class="card"><h1>Éclat</h1><p>Entrez un code postal. Éclat interroge le répertoire public des bibliothèques du ministère de la Culture.</p><div class="row"><input id="cp" inputmode="numeric" maxlength="5" placeholder="77400" aria-label="Code postal"><button id="go">Chercher</button></div><div class="status" id="status"></div><div class="results" id="results"></div></div></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function search(){const cp=document.querySelector('#cp').value.replace(/\D/g,'').slice(0,5),b=document.querySelector('#go'),st=document.querySelector('#status'),out=document.querySelector('#results');document.querySelector('#cp').value=cp;if(cp.length!==5){st.textContent='Entrez un code postal à 5 chiffres.';return}b.disabled=true;b.textContent='Recherche…';st.textContent='Recherche dans l’annuaire officiel…';out.innerHTML='';try{const r=await fetch('/api/bibliotheques?cp='+cp),j=await r.json();if(!r.ok)throw Error(j.error||'Recherche impossible');st.textContent=j.count+' bibliothèque'+(j.count>1?'s':'')+' trouvée'+(j.count>1?'s':'');out.innerHTML=(j.results||[]).map((x,i)=>'<article class="item"><span class="rank">'+(i+1)+'</span><div><strong>'+e(x.name)+'</strong><p>'+e([x.address,[x.postalCode,x.city].filter(Boolean).join(' ')].filter(Boolean).join(' · '))+'</p>'+(x.website?'<a href="'+e(x.website)+'" target="_blank" rel="noopener">Site de la bibliothèque ↗</a>':'')+'</div></article>').join('')||'<p>Aucun résultat pour ce code postal.</p>'}catch(err){st.textContent=err.message}finally{b.disabled=false;b.textContent='Chercher'}}document.querySelector('#go').onclick=search;document.querySelector('#cp').addEventListener('keydown',x=>{if(x.key==='Enter')search()});</script></body></html>
